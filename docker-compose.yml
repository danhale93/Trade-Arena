version: '3.8'

services:
  trade-arena:
    build: .
    image: trade-arena-permanent:latest
    container_name: trade-arena-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MM_PATH=/usr/local/bin/mm
      - DIRECT_EXECUTION_ENABLED=false
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/trpc/arbitrage.status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
