version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    # Create PRs for all dependency types (direct & indirect)
    allow:
      - dependency-type: "all"
    # Add labels so CI can auto-merge minor/patch upgrades if you configure automerge rules
    labels:
      - "dependencies"
      - "automated"
